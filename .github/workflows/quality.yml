name: Trackwise quality checks
on:
  push:
    branches: [main, ux-onboarding-refresh, signature-dashboard-refinement-20261016]
  pull_request:
    branches: [main, ux-onboarding-refresh, premium-blue-gold-ui-polish-20261016]
permissions:
  contents: read
jobs:
  build-and-test:
    name: TypeScript, automated tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy public values only for compiling; tests never access production data.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only-placeholder
    steps:
      - name: Check out application
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run lint
      - name: Run automated tests
        run: npm test
      - name: Validate backup helper syntax
        run: bash -n scripts/backup-trackwise.sh
      - name: Build Next.js application
        run: npm run build
