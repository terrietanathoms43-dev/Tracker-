name: Trackwise quality checks
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  # "Run workflow" on the Actions tab, on main or staging: the checks, then that branch deployed again
  # without a new commit (a deploy that failed on the server's side, an app that needs a restart).
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only placeholders: the build never connects, and tests use no database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3015
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  # A push to main or staging that passes the checks above is deployed by running deploy.sh on the VPS over SSH
  # (docs/RUNBOOK.md, "Staging"): main in the production checkout, staging in the staging checkout. The job
  # asks the server for one word, `production` or `staging`. The deploy key can run nothing but the server's
  # deploy gate, which knows the two directories, puts node on PATH, lets one deploy run at a time and runs
  # that checkout's deploy.sh. Four secrets, VPS_HOST, VPS_USER, VPS_SSH_KEY and VPS_HOST_KEY, as repository
  # secrets or on the `production` and `staging` environments. A pull request only runs the checks. Schema
  # changes stay a deliberate step (docs/RUNBOOK.md).
  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: checks
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'staging')
    runs-on: ubuntu-latest
    # Long enough to wait for the other branch's deploy to finish first, then build.
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      DEPLOY_TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Check the deploy secrets are set
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_KEY; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing. Add under Settings > Secrets and variables > Actions (docs/RUNBOOK.md, Staging)."
            exit 1
          fi
      - name: Install the deploy key and trust the server
        # `tr` drops the carriage returns a secret pasted from Windows can carry; ssh refuses a key that has them.
        # VPS_HOST_KEY is a known_hosts line ("<address> ssh-ed25519 AAAA…"); the bare key without its address
        # is given the address here.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          case "$VPS_HOST_KEY" in
            ssh-* | ecdsa-*) VPS_HOST_KEY="$VPS_HOST $VPS_HOST_KEY" ;;
          esac
          printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r' >> ~/.ssh/known_hosts
      - name: Pull, build and restart under pm2
        # Exit 255 here is SSH itself: "Permission denied" is VPS_SSH_KEY, "Host key verification failed" is
        # VPS_HOST_KEY. Any other failure is deploy.sh's own output above it.
        run: >-
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" "$DEPLOY_TARGET"
